services:
  - type: web
    name: weathergpt-backend
    runtime: docker
    rootDir: backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: weathergpt-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: WEATHER_PROVIDER
        value: open_meteo
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        value: '["https://YOUR-FRONTEND.onrender.com"]'

  - type: web
    name: weathergpt-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false

databases:
  - name: weathergpt-db
    databaseName: weathergpt
    user: weathergpt